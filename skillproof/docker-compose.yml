version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:5173
      - JWT_SECRET=skillproof_super_secret_jwt_key_2026_prod_quality
      - DATABASE_URL=file:./dev.db
      - UPLOAD_DIR=../uploads
    volumes:
      - ./uploads:/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - server

